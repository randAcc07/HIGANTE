name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The tests rely on MariaDB-only constraints (WITHOUT OVERLAPS, CHECK).
    # Port and credentials match .env.example, which `composer setup` copies.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Provision Database
        env:
          DB_DATABASE: higante
          DB_USERNAME: higante_app
          DB_PASSWORD: secret
          DB_MIGRATE_USERNAME: higante_migrate
          DB_MIGRATE_PASSWORD: migrate-secret
          DB_TEST_DATABASE: higante_test
        run: sh database/provisioning/provision.sh | docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -proot

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

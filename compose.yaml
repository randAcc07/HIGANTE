# Fixed, so containers and volumes are named the same on every machine
# whatever the checkout's folder is called.
name: higante

services:
    mariadb:
        image: mariadb:11.4
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            # Read by database/provisioning/provision.sh on first start.
            DB_DATABASE: ${DB_DATABASE:-higante}
            DB_USERNAME: ${DB_USERNAME:-higante_app}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            DB_MIGRATE_USERNAME: ${DB_MIGRATE_USERNAME:-higante_migrate}
            DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-migrate-secret}
            DB_TEST_DATABASE: higante_test
        ports:
            - '${DB_PORT:-3307}:3306'
        volumes:
            - mariadb-data:/var/lib/mysql
            - ./database/provisioning:/provisioning:ro
            - ./docker/mariadb/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            retries: 20

    # The app itself, for a machine without PHP or Node:
    #   docker compose --profile app up
    # Without the profile, only MariaDB starts (PHP and Node on the machine).
    app:
        profiles: [app]
        build: ./docker/app
        depends_on:
            mariadb:
                condition: service_healthy
        environment:
            # Inside the network the database is "mariadb" on 3306, whatever .env says.
            DB_HOST: mariadb
            DB_PORT: 3306
            APP_URL: http://localhost:${APP_PORT:-8000}
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - .:/app
            - app-vendor:/app/vendor
            - app-node-modules:/app/node_modules

volumes:
    mariadb-data:
    app-vendor:
    app-node-modules:

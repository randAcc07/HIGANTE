services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      # Read by database/provisioning/provision.sh on first start.
      DB_DATABASE: ${DB_DATABASE:-scheduler}
      DB_USERNAME: ${DB_USERNAME:-scheduler_app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_MIGRATE_USERNAME: ${DB_MIGRATE_USERNAME:-scheduler_migrate}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-migrate-secret}
      DB_TEST_DATABASE: scheduler_test
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/provisioning:/provisioning:ro
      - ./docker/mariadb/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  mariadb-data:
